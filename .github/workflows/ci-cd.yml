name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # GitHub Pages user-site repository and the folder the app is published to.
  SITE_REPO: huytran088/huytran088.github.io
  SITE_DIR: avp

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -------------------------------------------------------------------------
  # Lint, typecheck, Node unit tests
  # -------------------------------------------------------------------------
  checks:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Generate ANTLR parser
        run: npm run build-g4
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (node)
        run: npx vitest run --project node

  # -------------------------------------------------------------------------
  # Component tests in real browsers
  # -------------------------------------------------------------------------
  browser-tests:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Generate ANTLR parser
        run: npm run build-g4
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests
        run: npx vitest run --project browser --browser=${{ matrix.browser }}

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots-${{ matrix.browser }}
          path: screenshots/
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Build the static site, served at https://huytran088.github.io/avp/
  # -------------------------------------------------------------------------
  build-site:
    name: Build site
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Generate ANTLR parser
        run: npm run build-g4

      - name: Build and stage site
        run: npm run build:site
        env:
          VITE_BASE_PATH: /${{ env.SITE_DIR }}/

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: site
          path: build/site
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Publish into the avp/ folder of the GitHub Pages user site
  # (huytran088/huytran088.github.io), main only, after every test passed.
  # Authenticates with a write deploy key scoped to that single repository,
  # stored here as the USER_SITE_DEPLOY_KEY secret.
  # -------------------------------------------------------------------------
  deploy-site:
    name: Deploy to huytran088.github.io/avp
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build-site, browser-tests]
    runs-on: ubuntu-latest
    environment:
      name: user-site
      url: https://huytran088.github.io/avp/
    concurrency:
      group: user-site-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: site
          path: site

      - name: Check out user site
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.SITE_REPO }}
          ref: main
          ssh-key: ${{ secrets.USER_SITE_DEPLOY_KEY }}
          path: user-site

      - name: Replace ${{ env.SITE_DIR }}/ with the new build
        run: |
          rm -rf "user-site/${SITE_DIR}"
          mkdir -p "user-site/${SITE_DIR}"
          cp -a site/. "user-site/${SITE_DIR}/"

      - name: Commit and push
        working-directory: user-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "${SITE_DIR}"
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "Deploy ${SITE_DIR} from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push origin main

  # -------------------------------------------------------------------------
  # Docker image -> GitHub Container Registry
  # Built on every run; pushed for main and version tags.
  # -------------------------------------------------------------------------
  docker:
    name: Docker image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build (and push)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
