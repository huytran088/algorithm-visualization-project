name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -------------------------------------------------------------------------
  # Lint, typecheck, Node unit tests
  # -------------------------------------------------------------------------
  checks:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Generate ANTLR parser
        run: npm run build-g4
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (node)
        run: npx vitest run --project node

  # -------------------------------------------------------------------------
  # Component tests in real browsers
  # -------------------------------------------------------------------------
  browser-tests:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Generate ANTLR parser
        run: npm run build-g4
      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests
        run: npx vitest run --project browser --browser=${{ matrix.browser }}

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots-${{ matrix.browser }}
          path: screenshots/
          if-no-files-found: ignore

  # -------------------------------------------------------------------------
  # Build the static site for GitHub Pages
  # -------------------------------------------------------------------------
  build-site:
    name: Build site
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - run: npm ci
      - name: Generate ANTLR parser
        run: npm run build-g4

      - name: Build and stage site
        run: npm run build:site
        env:
          # e.g. "/algorithm-visualization-project/", derived from the Pages URL.
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/site

  # -------------------------------------------------------------------------
  # Deploy to GitHub Pages (main only, after every test has passed)
  # -------------------------------------------------------------------------
  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build-site, browser-tests]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1

  # -------------------------------------------------------------------------
  # Docker image -> GitHub Container Registry
  # Built on every run; pushed for main and version tags.
  # -------------------------------------------------------------------------
  docker:
    name: Docker image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build (and push)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
